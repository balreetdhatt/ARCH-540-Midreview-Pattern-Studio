  // ---------------------------------------------------------------- correlation context
  function makeCtx(gray, w, h) {
    const N = nextPow2(2 * Math.max(w, h));

    fft2(Fr, Fi, N, false); fft2(Mr, Mi, N, false); fft2(Qr, Qi, N, false);
    return { w, h, N, f, var: varr, fpad, mpad, Fr, Fi, Mr, Mi, Qr, Qi, minOv: 0.3 * w * h };
  }
  function nccMap(ctx, g, mg) {
    const N = ctx.N, n = N * N;
    const gr = Float64Array.from(g), gi = new Float64Array(n);
    fft2(gr, gi, N, false);
    const cr = new Float64Array(n), ci = new Float64Array(n);
    for (let i = 0; i < n; i++) {

      ci[i] = ctx.Fr[i] * gi[i] - ctx.Fi[i] * gr[i];
    }
    fft2(cr, ci, N, true);
    const hr = Float64Array.from(mg), hi = new Float64Array(n);

    const or_ = new Float64Array(n), oi = new Float64Array(n), er = new Float64Array(n), ei = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      or_[i] = ctx.Mr[i] * hr[i] + ctx.Mi[i] * hi[i];
      oi[i] = ctx.Mr[i] * hi[i] - ctx.Mi[i] * hr[i];
      er[i] = ctx.Qr[i] * hr[i] + ctx.Qi[i] * hi[i];
      ei[i] = ctx.Qr[i] * hi[i] - ctx.Qi[i] * hr[i];
    }
    fft2(or_, oi, N, true); fft2(er, ei, N, true);
    // energy of g under the mask of f
    const g2r = new Float64Array(n), g2i = new Float64Array(n);
    for (let i = 0; i < n; i++) g2r[i] = g[i] * g[i];
    fft2(g2r, g2i, N, false);
    const fr = new Float64Array(n), fi = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      fr[i] = ctx.Mr[i] * g2r[i] + ctx.Mi[i] * g2i[i];
      fi[i] = ctx.Mr[i] * g2i[i] - ctx.Mi[i] * g2r[i];
    }
    fft2(fr, fi, N, true);
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const o = or_[i], d = Math.sqrt(Math.max(er[i], 0) * Math.max(fr[i], 0));

    }

  }
  const at = (map, N, tx, ty) => map[((ty + N) & (N - 1)) * N + ((tx + N) & (N - 1))];
  function localMaxima(map, ctx, minV) {
    const N = ctx.N, W = ctx.w - 1, H = ctx.h - 1, peaks = [];
    for (let ty = -H; ty <= H; ty++) for (let tx = -W; tx <= W; tx++) {
      const v = at(map, N, tx, ty);
      if (v < minV) continue;
      let ok = true;
      for (let dy = -1; dy <= 1 && ok; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const u = at(map, N, tx + dx, ty + dy);
        if (u > v || (u === v && (dy < 0 || (dy === 0 && dx < 0)))) { ok = false; break; }

  }
  function subpix(map, N, tx, ty) {
    const c = at(map, N, tx, ty), l = at(map, N, tx - 1, ty), r = at(map, N, tx + 1, ty);
    const u = at(map, N, tx, ty - 1), d = at(map, N, tx, ty + 1);
    let x = tx, y = ty;
    if (l > -1 && r > -1) { const den = l - 2 * c + r; if (den < -1e-9) x += Math.max(-0.5, Math.min(0.5, 0.5 * (l - r) / den)); }
    if (u > -1 && d > -1) { const den = u - 2 * c + d; if (den < -1e-9) y += Math.max(-0.5, Math.min(0.5, 0.5 * (u - d) / den)); }

  }
  function maxOf(map, ctx) {
    let best = { v: -9, tx: 0, ty: 0 }; const N = ctx.N, W = ctx.w - 1, H = ctx.h - 1;
    for (let ty = -H; ty <= H; ty++) for (let tx = -W; tx <= W; tx++) { const v = at(map, N, tx, ty); if (v > best.v) best = { v, tx, ty }; }

  }
  function evalOp(ctx, R) {
    const { w, h, N, f } = ctx, cx = (w - 1) / 2, cy = (h - 1) / 2;
    const g = new Float64Array(N * N), m = new Float64Array(N * N);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = x - cx, dy = y - cy;
      const sx = R[0] * dx + R[1] * dy + cx, sy = R[2] * dx + R[3] * dy + cy;
      if (sx < 0 || sy < 0 || sx > w - 1 || sy > h - 1) continue;
      const x0 = Math.floor(sx), y0 = Math.floor(sy), x1 = Math.min(x0 + 1, w - 1), y1 = Math.min(y0 + 1, h - 1);
      const fx = sx - x0, fy = sy - y0;
      g[y * N + x] = (f[y0 * w + x0] * (1 - fx) + f[y0 * w + x1] * fx) * (1 - fy) + (f[y1 * w + x0] * (1 - fx) + f[y1 * w + x1] * fx) * fy;

  // ---------------------------------------------------------------- lattice
  const len = v => Math.hypot(v.x, v.y), dot = (a, b) => a.x * b.x + a.y * b.y;
  function reduceBasis(a, b) {

  function classify(v1, v2) {
    const a = len(v1), b = len(v2);

    const eq = Math.abs(a - b) / Math.max(a, b) < 0.05;
    let type;

  }
  function snap(v1, v2, type) {

  function refineVec(v, ac, ctx, top) {

  function findLattice(ac, ctx, P) {

      let mn = 9;
      for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
        if ((i === 0 && j === 0) || (j < 0) || (j === 0 && i < 0)) continue;

        if (Math.hypot(x, y) > lim) continue;

        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) m = Math.max(m, at(ac, ctx.N, Math.round(x) + dx, Math.round(y) + dy));

    for (const p of pairs) {
      const f = fitOf(p.a, p.b);
      if (f > bestFit + 1e-9) { bestFit = f; bestPair = p; }
      if (f >= 0.9 && pointsOk(p.a, p.b) >= 0.85 * top) { chosen = p; break; }
    }
    if (!chosen) chosen = bestPair;
    let v1 = refineVec(chosen.a, ac, ctx, top), v2 = refineVec(chosen.b, ac, ctx, top);
    [v1, v2] = reduceBasis(v1, v2);
    let cls = classify(v1, v2);
    [v1, v2] = snap(v1, v2, cls.type);
    cls = classify(v1, v2);
    const fit = fitOf(v1, v2);
    return { v1, v2, ...cls, fit, top, p1: at(ac, ctx.N, Math.round(v1.x), Math.round(v1.y)), p2: at(ac, ctx.N, Math.round(v2.x), Math.round(v2.y)) };
  }

  // ---------------------------------------------------------------- symmetry tests
  function fixedPoint(R, tau) {

      const tau = { x: R[0] * (p.x - cx) + R[1] * (p.y - cy) + cx, y: R[2] * (p.x - cx) + R[3] * (p.y - cy) + cy };
      return fixedPoint(R, tau);
    }).filter(Boolean);

  }
  function mirrorTest(ctx, phi, tol) {

    if (type === 'square') return [
      { id: 'along v1', set: 'axis', phi: ang(v1) }, { id: 'along v2', set: 'axis', phi: ang(v2) },

      { id: 'across v1', set: 'perp', phi: ang(v1) + H }, { id: 'across v2', set: 'perp', phi: ang(v2) + H }, { id: 'across v2-v1', set: 'perp', phi: ang(dif) + H }];

  function decide(lat, rot, mirrors, T) {

  // ---------------------------------------------------------------- analyze
  function stop(code, message, advice) { return { ok: false, stop: { code, message, advice } }; }
  function analyze(gray, w, h, opts) {
    const P = Object.assign({ tSym: 0.4, margin: 0.12, minPeak: 0.2 }, opts || {});
    if (Math.min(w, h) < 40) return stop('too_small', 'The image is too small to find a repeat (under 40 px on a side).', 'Use a larger crop that shows at least two repeats in each direction.');

    let d1x=p.x-v.x,d1y=p.y-v.y,d2x=q.x-v.x,d2y=q.y-v.y;const L1=Math.hypot(d1x,d1y),L2=Math.hypot(d2x,d2y);if(L1<1e-6||L2<1e-6){out.push(v);continue;}

    const ax=v.x+d1x*t,ay=v.y+d1y*t,ex=v.x+d2x*t,ey=v.y+d2y*t;
    let a0=Math.atan2(ay-cy,ax-cx),a1=Math.atan2(ey-cy,ex-cx);let da=a1-a0;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;

    for(let j=0;j<=k;j++){const a=a0+da*j/k;out.push(V(cx+rr*Math.cos(a),cy+rr*Math.sin(a)));}}

function rnd(x,y,seed){const h=Math.sin(x*12.9898+y*78.233+seed*37.719)*43758.5453;return h-Math.floor(h);}

/* ================= tilings ================= */

  tri:{lat:'hex',tiles:P=>[{n:3,r:P/SQ3,a:90*D,dx:P/2,dy:P*SQ3/6},{n:3,r:P/SQ3,a:-90*D,dx:P,dy:P*SQ3/3}]},
  octsq:{lat:'square',tiles:P=>{const s=P/(1+SQ2);return[{n:8,r:s/(2*Math.sin(Math.PI/8)),a:22.5*D},{n:4,r:s/SQ2,a:0,dx:P/2,dy:P/2}];}},
  trihex:{lat:'hex',tiles:P=>[{n:6,r:P/2,a:0},{n:3,r:P/(2*SQ3),a:-90*D,dx:P/2,dy:P*SQ3/6},{n:3,r:P/(2*SQ3),a:90*D,dx:P/2,dy:-P*SQ3/6}]},
  dodtri:{lat:'hex',tiles:P=>{const r=(P/2)/Math.cos(15*D),s=P*Math.tan(15*D);return[{n:12,r,a:15*D},{n:3,r:s/SQ3,a:-90*D,dx:P/2,dy:P*SQ3/6},{n:3,r:s/SQ3,a:90*D,dx:P/2,dy:-P*SQ3/6}];}},
  dodhexsq:{lat:'hex',tiles:P=>{const s=P/(3+SQ3);return[{n:12,r:s/(2*Math.sin(15*D)),a:15*D},{n:6,r:s,a:0,dx:P/2,dy:P*SQ3/6},{n:6,r:s,a:0,dx:P/2,dy:-P*SQ3/6},{n:4,r:s/SQ2,a:45*D,dx:P/2,dy:0},{n:4,r:s/SQ2,a:15*D,dx:P/4,dy:P*SQ3/4},{n:4,r:s/SQ2,a:75*D,dx:-P/4,dy:P*SQ3/4}];}},
  rhombi:{lat:'hex',tiles:P=>{const s=P/(1+SQ3);return[{n:6,r:s,a:30*D},{n:4,r:s/SQ2,a:45*D,dx:P/2,dy:0},{n:4,r:s/SQ2,a:15*D,dx:P/4,dy:P*SQ3/4},{n:4,r:s/SQ2,a:75*D,dx:-P/4,dy:P*SQ3/4},{n:3,r:s/SQ3,a:90*D,dx:P/2,dy:P*SQ3/6},{n:3,r:s/SQ3,a:-90*D,dx:P/2,dy:-P*SQ3/6}];}},

const TILE_NAME={3:'Triangles',4:'Squares',6:'Hexagons',8:'Octagons',12:'Dodecagons'};
function tileKinds(id){const ks=[];for(const t of TILINGS[id].tiles(100))if(!ks.includes(t.n))ks.push(t.n);return ks;}
function tileMotifs(id,P){const ks=tileKinds(id);return TILINGS[id].tiles(P).map(t=>({kind:ks.indexOf(t.n),dx:t.dx||0,dy:t.dy||0,pts:regPoly(t.n,t.r,t.a)}));}

/* Hankin's polygons-in-contact (Kaplan's greedy pairing): rays from each tile edge at contact angle theta;

function hankinSegs(poly,theta,delta){
  const n=poly.length,rays=[];const ct=Math.cos(theta),st=Math.sin(theta);
  for(let i=0;i<n;i++){const a=poly[i],b=poly[(i+1)%n];const L=Math.hypot(b.x-a.x,b.y-a.y);const ex=(b.x-a.x)/L,ey=(b.y-a.y)/L,nx=-ey,ny=ex;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,c=delta*L/2;
    rays.push({e:i,px:mx-c*ex,py:my-c*ey,ux:ct*ex+st*nx,uy:ct*ey+st*ny,len:-1});
    rays.push({e:i,px:mx+c*ex,py:my+c*ey,ux:-ct*ex+st*nx,uy:-ct*ey+st*ny,len:-1});}
  const inside=(x,y)=>{for(let i=0;i<n;i++){const a=poly[i],b=poly[(i+1)%n];if((b.x-a.x)*(y-a.y)-(b.y-a.y)*(x-a.x)<-1e-6)return false;}return true;};
  // collinear rays from different edges heading toward each other merge into one chord
  for(let i=0;i<rays.length;i++)for(let j=i+1;j<rays.length;j++){const r=rays[i],o=rays[j];if(r.e===o.e||r.len>=0||o.len>=0)continue;
    if(r.ux*o.ux+r.uy*o.uy>-0.999999)continue;const dx=o.px-r.px,dy=o.py-r.py;if(Math.abs(dx*r.uy-dy*r.ux)>1e-6)continue;const t=dx*r.ux+dy*r.uy;if(t>1e-6){r.len=t;o.len=t;}}
  const ev=[];
  for(let i=0;i<rays.length;i++)for(let j=i+1;j<rays.length;j++){const r=rays[i],o=rays[j];if(r.e===o.e||r.len>=0||o.len>=0)continue;const cr=r.ux*o.uy-r.uy*o.ux;if(Math.abs(cr)<1e-9)continue;
    const dx=o.px-r.px,dy=o.py-r.py;const t=(dx*o.uy-dy*o.ux)/cr,u=(dx*r.uy-dy*r.ux)/cr;if(t<=1e-6||u<=1e-6)continue;
    if(!inside(r.px+r.ux*t,r.py+r.uy*t))continue;ev.push({i,j,t,u,d:Math.max(t,u)});}
  ev.sort((a,b)=>a.d-b.d);
  for(const e of ev){if(rays[e.i].len<0&&rays[e.j].len<0){rays[e.i].len=e.t;rays[e.j].len=e.u;}}

  for(const r of rays){if(r.len>=0)continue;let best=Infinity;
    for(const o of rays){if(o===r||o.len<0)continue;const cr=r.ux*o.uy-r.uy*o.ux;if(Math.abs(cr)<1e-9)continue;const dx=o.px-r.px,dy=o.py-r.py;const t=(dx*o.uy-dy*o.ux)/cr,u=(dx*r.uy-dy*r.ux)/cr;if(t>1e-6&&u>-1e-6&&u<=o.len+1e-6&&t<best)best=t;}
    if(isFinite(best))r.len=best;}
  const segs=[];for(const r of rays)if(r.len>1e-4)segs.push([r.px,r.py,r.px+r.ux*r.len,r.py+r.uy*r.len]);
  return segs;
}

/* ================= line arrangement → faces ================= */
function clipSeg(s,x0,y0,x1,y1){ // Liang–Barsky
  let[ax,ay,bx,by]=s;const dx=bx-ax,dy=by-ay;let t0=0,t1=1;
  const P=[-dx,dx,-dy,dy],Q=[ax-x0,x1-ax,ay-y0,y1-ay];
  for(let i=0;i<4;i++){if(P[i]===0){if(Q[i]<0)return null;}else{const t=Q[i]/P[i];if(P[i]<0){if(t>t1)return null;if(t>t0)t0=t;}else{if(t<t0)return null;if(t<t1)t1=t;}}}
  if(t1-t0<1e-9)return null;return[ax+dx*t0,ay+dy*t0,ax+dx*t1,ay+dy*t1];
}
function cutByRect(s,r){ // parts of segment outside rect r (0,1 or 2 pieces)
  const inside=clipSeg(s,r[0],r[1],r[2],r[3]);if(!inside)return[s];
  const out=[];const[ax,ay,bx,by]=s;const d=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
  if(d([ax,ay],[inside[0],inside[1]])>1e-6)out.push([ax,ay,inside[0],inside[1]]);
  if(d([bx,by],[inside[2],inside[3]])>1e-6)out.push([inside[2],inside[3],bx,by]);
  return out;
}
function facesFromSegments(segs,region,excl){
  const S=[];
  for(const s of segs){const c=clipSegConvex(s,region);if(!c)continue;if(excl){for(const p of cutByRect(c,excl))S.push(p);}else S.push(c);}
  for(let i=0;i<region.length;i++){const a=region[i],b=region[(i+1)%region.length];S.push([a.x,a.y,b.x,b.y]);}
  if(excl){const[e0,e1,e2,e3]=excl;S.push([e0,e1,e2,e1],[e2,e1,e2,e3],[e2,e3,e0,e3],[e0,e3,e0,e1]);}

  let tot=0;for(const s of S)tot+=Math.hypot(s[2]-s[0],s[3]-s[1]);const cs=Math.max(4,tot/N*1.2);
  const grid=new Map();const key=(i,j)=>i*100003+j;

  const cuts=S.map(()=>[]);const tested=new Set();const EPS=1e-7;

    const A=S[i],B=S[j];const rx=A[2]-A[0],ry=A[3]-A[1],sx=B[2]-B[0],sy=B[3]-B[1];const cr=rx*sy-ry*sx;const qx=B[0]-A[0],qy=B[1]-A[1];
    const LA=Math.hypot(rx,ry),LB=Math.hypot(sx,sy);

      for(const[px,py]of[[A[0],A[1]],[A[2],A[3]]]){const u=((px-B[0])*sx+(py-B[1])*sy)/ss;if(u>1e-6&&u<1-1e-6)cuts[j].push(u);}

  const TOL=0.05,nodes=[],nk=new Map();
  const getNode=(x,y)=>{const ci=Math.floor(x/TOL),cj=Math.floor(y/TOL);for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){const l=nk.get(key(i,j));if(!l)continue;for(const id of l){const nd=nodes[id];if(Math.abs(nd.x-x)<=TOL&&Math.abs(nd.y-y)<=TOL)return id;}}

  for(let k=0;k<N;k++){const s=S[k];const ts=cuts[k];ts.push(0,1);ts.sort((a,b)=>a-b);let prev=-1;
    for(const t of ts){const id=getNode(s[0]+(s[2]-s[0])*t,s[1]+(s[3]-s[1])*t);if(prev>=0&&id!==prev){nodes[prev].adj.add(id);nodes[id].adj.add(prev);}prev=id;}}
  // prune dangling
  const q=[];for(let i=0;i<nodes.length;i++)if(nodes[i].adj.size<=1)q.push(i);
  while(q.length){const i=q.pop();const nd=nodes[i];if(nd.adj.size>1)continue;for(const j of nd.adj){nodes[j].adj.delete(i);if(nodes[j].adj.size<=1)q.push(j);}nd.adj.clear();}
  const adj=nodes.map((nd,i)=>{const a=[...nd.adj];a.sort((p,q2)=>Math.atan2(nodes[p].y-nd.y,nodes[p].x-nd.x)-Math.atan2(nodes[q2].y-nd.y,nodes[q2].x-nd.x));return a;});
  const pos=adj.map(a=>{const m=new Map();a.forEach((w,i)=>m.set(w,i));return m;});
  const M=nodes.length,seen=new Set(),faces=[];
  for(let u=0;u<M;u++)for(const v0 of adj[u]){if(seen.has(u*M+v0))continue;
    let a=u,b=v0;const poly=[];let steps=0;
    while(!seen.has(a*M+b)&&steps++<100000){seen.add(a*M+b);poly.push(V(nodes[a].x,nodes[a].y));const list=adj[b];if(!list.length)break;const idx=pos[b].get(a);const w=list[(idx-1+list.length)%list.length];a=b;b=w;}
    if(poly.length>=3){const ar=area(poly);if(ar>1){if(excl){const bb=bbox(poly);if(poly.length===4&&Math.abs(bb[0]-excl[0])<.1&&Math.abs(bb[1]-excl[1])<.1&&Math.abs(bb[2]-excl[2])<.1&&Math.abs(bb[3]-excl[3])<.1)continue;}faces.push(poly);}}}

}

/* ================= pattern library ================= */
const C1=SQ2/2,C2=(SQ2-1)/2;

const LAT={square:P=>[P,0,0,P],hex:P=>[P,0,P/2,P*SQ3/2]};

/* ---- shape helpers shared by the natural, floral and composed motifs ---- */
function rot2(pts,a){if(!a)return pts;const c=Math.cos(a),s=Math.sin(a);return pts.map(q=>V(q.x*c-q.y*s,q.x*s+q.y*c));}
function mv(pts,dx,dy){return pts.map(q=>V(q.x+dx,q.y+dy));}
/* a petal / leaf running from r0 out to len along a0, widest where bias puts it */
function petalPts(len,wid,a0,bias,r0){r0=r0||0;const n=18,o=[],w=t=>wid*Math.sin(Math.PI*Math.pow(t,bias||.7)),X=t=>r0+(len-r0)*t;
  o.push(V(X(0),0));for(let i=1;i<n;i++){const t=i/n;o.push(V(X(t),w(t)));}
  o.push(V(X(1),0));for(let i=n-1;i>=1;i--){const t=i/n;o.push(V(X(t),-w(t)));}
  return rot2(o,a0);}
/* a comma / teardrop with a curled tip: round belly at u=0, point at u=1 */
function paisleyPts(R,curl,wid){const n=40,A=[],B=[];
  const pt=u=>{const a=-Math.PI*.35+curl*TAU*u,rr=R*(.5+.5*(1-u));return V(rr*Math.cos(a),rr*Math.sin(a));};
  for(let i=0;i<=n;i++){const u=i/n,c=pt(u),c2=pt(Math.min(1,u+1/n)),c0=pt(Math.max(0,u-1/n));
    const tx=c2.x-c0.x,ty=c2.y-c0.y,L=Math.hypot(tx,ty)||1,nx=-ty/L,ny=tx/L;
    const w=wid*R*Math.sin(Math.PI*Math.pow(u,.38));

/* union-of-circles outline: n lobes of radius k, centres on a circle — a rosette or a gothic foil */

  for(let i=0;i<N;i++){const a=i*TAU/N,dx=Math.cos(a),dy=Math.sin(a);let best=0;
    for(const[cx,cy]of cs){const dc=dx*cx+dy*cy;const t=dc+Math.sqrt(Math.max(0,dc*dc-(cx*cx+cy*cy)+rr*rr));if(t>best)best=t;}

/* one vocabulary of shapes, used by the composed motif and by anything else that wants a named form */

    motifs(P,p){const r=p.fill*P/2/(1+p.k),c=p.k*r,n=p.lobes,N=Math.max(72,18*n),pts=[];const cs=[];for(let i=0;i<n;i++){const a=p.spin*D+i*TAU/n;cs.push([c*Math.cos(a),c*Math.sin(a)]);}

      for(let f=0;f<p.fam;f++){const a=f*p.spread*D;const d=P*(f%2?p.ratio:1);const nx=-Math.sin(a),ny=Math.cos(a);const ux=Math.cos(a),uy=Math.sin(a);const ph=(f%2?p.phase:0)*d;

    global(P,p,bb){const o=[];const cx=bb[0]+p.cx*(bb[2]-bb[0]),cy=bb[1]+p.cy*(bb[3]-bb[1]);const rmax=Math.max(...[[bb[0],bb[1]],[bb[2],bb[1]],[bb[0],bb[3]],[bb[2],bb[3]]].map(([x,y])=>Math.hypot(x-cx,y-cy)));
      let r=P*p.core,gap=P,k=0;const radii=[];while(r<rmax&&radii.length<400){radii.push(r);r+=gap;gap*=p.grow;k++;}

function rawHoles(st,region,excl){

  const tx=cx+st.offX*P,ty=cy+st.offY*P;

  const corners=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(([x,y])=>toLocal(x,y));
  const pad=P*1.6;const lb=[Math.min(...corners.map(c=>c.x))-pad,Math.min(...corners.map(c=>c.y))-pad,Math.max(...corners.map(c=>c.x))+pad,Math.max(...corners.map(c=>c.y))+pad];

  const lat=latticeOf(spec,P,pp);
  const eachCell=fn=>{const[ax,,bx,by]=lat;if(!(ax>0&&by>0))return;const jmin=Math.floor(lb[1]/by)-1,jmax=Math.ceil(lb[3]/by)+1;let count=0;
    for(let j=jmin;j<=jmax;j++){const ox=j*bx,oy=j*by;const imin=Math.floor((lb[0]-ox)/ax)-1,imax=Math.ceil((lb[2]-ox)/ax)+1;for(let i=imin;i<=imax;i++){if(count++>40000)return;fn(ox+i*ax,oy);}}};
  const exclOut=excl?[excl[0]-st.bar/2,excl[1]-st.bar/2,excl[2]+st.bar/2,excl[3]+st.bar/2]:null;
  if(spec.type==='motif'){
    const base=spec.motifs(P,pp).map(m=>({pts:ccw(m.pts),kind:m.kind,dx:m.dx||0,dy:m.dy||0})).filter(m=>st.kindOn[m.kind]!==false);
    const out=[];
    eachCell((px,py)=>{for(const m of base){let pts=m.pts.map(q=>toPanel(q.x+px+m.dx,q.y+py+m.dy));
      if(st.clip){pts=clipConvex(pts,region);if(pts.length<3)continue;}
      else{let ok=true;for(const q of pts){if(!pointInConvex(q,region)){ok=false;break;}}if(!ok)continue;}
      if(exclOut){const bb=bbox(pts);if(bb[2]>exclOut[0]&&bb[0]<exclOut[2]&&bb[3]>exclOut[1]&&bb[1]<exclOut[3])continue;}

      else{let ok=true;for(const q of pts){if(!pointInConvex(q,region)){ok=false;break;}}if(!ok)continue;}
      if(exclOut){const bb=bbox(pts);if(bb[2]>exclOut[0]&&bb[0]<exclOut[2]&&bb[3]>exclOut[1]&&bb[1]<exclOut[3])continue;}

  else eachCell((px,py)=>{for(const s of spec.segs(P,pp))push([s[0]+px,s[1]+py,s[2]+px,s[3]+py]);});

function generate(st){

    res={holes:[],open:0,W,H,warn:false,outline,area:area(outline)};st._warn=false;

    const outer=offsetPoly(outline,m(st.frameL)-hb)||inner;

  res={holes:[],open:0,W,H,warn:false,outline:null,area:W*H};st._warn=false;if(fx1<=fx0||fy1<=fy0)return res;
  const bw=st.border&&st.border.width>0?st.border.width:0;

  if(bw>0&&fx1-fx0>2*bw+st.cell*.5&&fy1-fy0>2*bw+st.cell*.5){
    const field=[fx0+bw,fy0+bw,fx1-bw,fy1-bw];
    raws=rawHoles(st,rectPoly(field[0]-hb,field[1]-hb,field[2]+hb,field[3]+hb),null);
    const b=st.border;const pp=Object.assign({},st.pp,{[b.pattern]:Object.assign(defaultParams(b.pattern),b.pp||{})});

    for(const[bx0,by0,bx1,by1,extraRot]of bands){

function finish(st,res,raws){
  const W=res.W,H=res.H;
  const g=st.grad||{dir:'none',k:0};const two=PATTERNS[st.pattern].kinds.length>1;
  const rmax=Math.hypot(W,H)/2;const seed=st.seed||0;
  for(const h of raws){
    const c=centroid(h.pts);
    if(st.solid>0&&rnd(Math.round(c.x),Math.round(c.y),seed)<st.solid)continue;
    let f=0;switch(g.dir){case'up':f=c.y/H;break;case'down':f=1-c.y/H;break;case'right':f=c.x/W;break;case'left':f=1-c.x/W;break;case'centre':f=Math.hypot(c.x-W/2,c.y-H/2)/rmax;break;case'edge':f=1-Math.hypot(c.x-W/2,c.y-H/2)/rmax;break;case'random':f=rnd(Math.round(c.x),Math.round(c.y),seed+11);break;}
    const extra=g.k*f*st.cell*.5;
    let d=st.bar/2+extra+(two?(h.kind===0?-1:1)*st.balance*st.bar/2:0);
    let q=offsetPoly(ccw(h.pts),d);if(!q)continue;
    if(st.radius>0)q=roundCorners(q,st.radius);
    const a=area(q);if(a<4)continue;const bb=bbox(q);if(Math.min(bb[2]-bb[0],bb[3]-bb[1])<1.5)continue;
    res.holes.push({pts:q,kind:h.kind});res.open+=a;

}

+'                    light. Pick it when the image should appear and dissolve as the sun moves, or the brief\n'

+'                    halftone cut into metal (Zahner ImageWall, Imark Ocular). Pick it when the brief wants a\n'

+'            drop|none) with c_n points 3..16, c_r size 0.1..1.05, c_inner waist 0.1..0.95, c_spin deg;\n'

+'             "c_n":8,"c_r":0.55,"c_inner":0.42,"c_spin":0,"s_count":8,"s_shape":"drop","s_r":0.13,\n'
+'             "s_orbit":0.8,"s_spin":22,"g_count":0,"g_shape":"circle","g_r":0.16}}}\n'

+'  radius    mm 0..25 corner rounding.  solid 0..0.6 share of openings left solid at random\n'
+'  border    {width: mm 0..400, pattern: id, cell: mm, rot: deg, clip: bool}; width 0 for none\n'

+'        contrast: 0.3..2.5, detail: 0..1 local-contrast boost \u2014 raise it to 0.4..0.6 when the\n'

+'          would otherwise be averaged away by the tile grid; leave it 0 for soft subjects,\n'
+'        levels: 0..12 tone steps (0 = continuous), invert: bool,\n'

+'   person wants THEIR description drawn, not a stock image swapped in. Built-ins are for a brief that\n'
+'   names one: clouds=cumulus, wave=breaking water, ridge=drawn mountain range, flower=one open bloom from above,\n'
+'   facets=faceted geometric field, radial=rising disc, rings, ramp, grid and bars=test charts, and\n'

+'   well round to the side, or high overhead, gives the most. Azimuth 35..65 with elevation\n'

+'    Push values toward the end of the range the words imply.\n'
+' 4. Never invent a precision the brief did not give. Put the guess in "unsure" instead.\n'
+' 5. If the motif may be sacred or belong to a community, say so in "rationale" — plainly, once,\n'

const GRADS=['none','up','down','left','right','centre','edge','random'];
const RELIEFS=['through','emboss','deboss','terrace','terraceIn'];
const RRULES=['uniform','size','grad','random'];
function num(v,lo,hi,d,name,fix){const n=+v;if(!isFinite(n)){if(v!=null&&name)fix.push(name+' was not a number');return d;}

function pick(v,list,d,name,fix){if(list.indexOf(v)>=0)return v;if(v!=null&&name)fix.push(name+' "'+v+'" is not one of '+list.slice(0,6).join(', ')+'…, used '+d);return d;}
function clampPP(id,pp,fix){const out={};if(!PATTERNS[id]||!pp)return out;
  for(const q of PATTERNS[id].params){if(!(q.k in pp))continue;
    out[q.k]=q.type==='select'?pick(pp[q.k],q.opts.map(o=>o[0]),q.def,id+'.'+q.k,fix):num(pp[q.k],q.min,q.max,q.def,id+'.'+q.k,fix);}

/* everything the model sends is pulled into range before it can touch the panel, and every

function validateProposal(p){

  if(p.omb&&p.omb.image==='gondola'&&!p._keyword&&sampleNS&&!/photo|photograph|picture of the gondola|test image/i.test(lastBrief||'')){

    if(p.omb.pitch<p.omb.tileD*.45){fix.push('pitch '+p.omb.pitch+' mm is far below the Ø'+p.omb.tileD+' mm tile, opened to '+(p.omb.tileD*.8).toFixed(1));p.omb.pitch=+(p.omb.tileD*.8).toFixed(1);}

      levels:Math.round(num(f.levels,0,12,0,'perf.levels',fix)),invert:!!f.invert,

function describeProposal(p){

function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

   the image — which is why the picture is tuned to one sun position and dissolves away from it.

const PHOTOS={};
function photoEl(id){if(PHOTOS[id])return PHOTOS[id];const im=new Image();im.src=PHOTO_SRC[id];PHOTOS[id]=im;return im;}
/* decode it now rather than at first click: a panel built before the image is ready comes out
   black, and the user sees an empty sheet for one frame (or, in a test, for good) */
for(const k in PHOTO_SRC)photoEl(k);

const OMB_BUILTIN=[['gondola','Grouse Mountain gondola (photo)'],['clouds','Cloud bank'],['wave','Breaking wave'],['ridge','Coast range'],
  ['flower','Open flower'],['facets','Faceted field'],['radial','Rising disc'],
  ['rings','Concentric rings'],['ramp','Tone ramp'],['grid','Tone chart · calibration'],
  ['bars','Resolution bars · calibration']];

/* ---- the designs. Subjects follow what Ombrae panels actually carry: weather,
   landscape, foliage, faceted geometry, lettering — photo realism through to
   geometric patterning. The last two are calibration charts, not pictures. ---- */
function ombBuiltin(id){const W=S.width,H=S.height,cv=ombCanvas(W,H),x=cv.getContext('2d'),w=cv.width,h=cv.height;
  x.fillStyle='#000';x.fillRect(0,0,w,h);
  if(id==='waves')id='wave';
  if(id==='leaf')id='flower';   /* saved designs from before the flower */

  /* a photograph rather than a drawing: hand it to the same fit-and-rasterise path an upload uses */
  if(PHOTO_SRC[id]){const im=photoEl(id);
    const take=()=>{OMB.srcEl=im;OMB.kind='builtin:'+id;OMB.fitKey='';ombDrawSource(im,S.width,S.height);};
    if(im.complete&&im.naturalWidth){take();return;}
    im.addEventListener('load',()=>{if((S.omb.src||'').indexOf(id)>=0){take();ombPreview();schedule('geom');}},{once:true});
    /* mid-grey, not black: the panel still builds while the photograph decodes */
    x.fillStyle='#808080';x.fillRect(0,0,w,h);
    OMB.srcEl=cv;OMB.kind='builtin:'+id;OMB.fitKey=fitKeyNow();ombField(cv);return;}

  if(id==='clouds'){
    /* domain-warped fbm: billows, lit from the upper left, over a graded sky */
    /* six octaves, lightly warped: fewer and the mask cuts straight diagonal edges that read
       as broken glass rather than cloud */
    const nAt=(u,v)=>{const wp=fbm(u*.8+3.1,v*.8+1.7,29,4);return fbm(u+wp*.75,v+wp*.55,11,6);};
    ombProc(cv,(u,v)=>{const U=u*3.0,V=v*2.1;
      const n=nAt(U,V);
      const band=clamp(1.30-Math.abs(v-.46)*2.2,0,1);   /* cumulus sit in a band, bases flattish */
      const m=clamp((n*band-.33)*4.4,0,1);
      const sh=clamp(.5+(n-nAt(U+.17,V+.21))*7.0,0,1);
      const sky=.05+.17*v;
      const cloud=.26+.74*Math.pow(sh,.8);
      return sky*(1-m)+cloud*m;},320);
  }

  else if(id==='wave'){
    const g=x.createLinearGradient(0,0,0,h*.55);g.addColorStop(0,'#e3e3e3');g.addColorStop(1,'#8a8a8a');
    x.fillStyle=g;x.fillRect(0,0,w,h);
    /* trochoidal swells: flat troughs, pointed crests — a sine alone reads as moiré, not water */
    const swells=[{y:.44,a:.075,f:1.5,p:.05,t:[172,112]},{y:.56,a:.095,f:1.15,p:.40,t:[140,80]},
                  {y:.71,a:.120,f:.86,p:.78,t:[104,44]},{y:.90,a:.150,f:.60,p:1.20,t:[66,16]}];
    const rel=(sw,X)=>{const s=Math.sin(TAU*(X/w*sw.f+sw.p));
      return Math.sign(s)*Math.pow(Math.abs(s),.60)+.24*Math.sin(TAU*(X/w*sw.f*2.4+sw.p*1.7));};
    const surf=(sw,X)=>h*sw.y-h*sw.a*rel(sw,X);
    for(const sw of swells){
      const gg=x.createLinearGradient(0,h*sw.y-h*sw.a*1.3,0,h);
      gg.addColorStop(0,'rgb('+sw.t[0]+','+sw.t[0]+','+sw.t[0]+')');
      gg.addColorStop(1,'rgb('+sw.t[1]+','+sw.t[1]+','+sw.t[1]+')');
      x.fillStyle=gg;x.beginPath();x.moveTo(0,h);
      for(let X=0;X<=w;X+=2)x.lineTo(X,surf(sw,X));
      x.lineTo(w,h);x.closePath();x.fill();
      x.strokeStyle='#ffffff';x.lineWidth=Math.max(1.5,h*.013);x.beginPath();
      for(let X=0;X<=w;X+=2){const Y=surf(sw,X);X?x.lineTo(X,Y):x.moveTo(X,Y);}x.stroke();
    }
    /* foam on the crests of the two nearest swells */
    x.fillStyle='#ffffff';
    for(const sw of swells.slice(2)){
      for(let X=0;X<=w;X+=3){const r0=rel(sw,X);if(r0<.5)continue;
        const rr=h*sw.a*.42*(r0-.45)*2.2*(.65+.7*rnd(X,sw.p*100,4));
        if(rr<.4)continue;const Y=surf(sw,X);
        x.beginPath();x.ellipse(X,Y+rr*.55,rr*1.7,rr,0,0,TAU);x.fill();}}
  }

  else if(id==='ridge'){
    const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#fafafa');g.addColorStop(.5,'#c6c6c6');g.addColorStop(1,'#5a5a5a');
    x.fillStyle=g;x.fillRect(0,0,w,h);
    /* midpoint displacement, five ranges, far ones pale — aerial perspective does the tonal work */
    for(let L=0;L<5;L++){
      const n=129,hg=new Float64Array(n);let step=n-1,amp=h*(.30-.035*L);
      while(step>1){const half=step>>1;
        for(let i=half;i<n;i+=step)hg[i]=(hg[i-half]+hg[i+half])/2+(rnd(i*7+1,L*131+step,9)-.5)*amp*2;
        step=half;amp*=.60;}
      const base=h*(.38+.145*L),tone=Math.round(234-L*44);
      x.fillStyle='rgb('+tone+','+tone+','+tone+')';
      x.beginPath();x.moveTo(0,h);
      for(let i=0;i<n;i++)x.lineTo(i/(n-1)*w,base-Math.abs(hg[i]));
      x.lineTo(w,h);x.closePath();x.fill();
      if(L>=3){/* snow on the near peaks */
        x.fillStyle='rgba(255,255,255,'+(L===4?.85:.5)+')';x.beginPath();let open=false;
        for(let i=0;i<n;i++){const Y=base-Math.abs(hg[i]);
          if(Y<base-h*.16){if(!open){x.moveTo(i/(n-1)*w,base-h*.16);open=true;}x.lineTo(i/(n-1)*w,Y);}
          else if(open){x.lineTo(i/(n-1)*w,base-h*.16);x.closePath();open=false;}}
        if(open){x.lineTo(w,base-h*.16);x.closePath();}x.fill();}
    }
  }

  else if(id==='flower'){
    /* one open bloom seen from above: two rings of petals, each lit from its tip, over a dark ground.
       Big simple shapes with a full tonal range are what a tile panel can carry; fine veins are not. */
    const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#121212');g.addColorStop(1,'#383838');
    x.fillStyle=g;x.fillRect(0,0,w,h);
    const cx=w*.5,cy=h*.52,R=Math.min(w,h)*.45;
    const petal=(ang,len,wid,base,mid)=>{x.save();x.translate(cx,cy);x.rotate(ang);
      const pg=x.createLinearGradient(0,0,0,-len);pg.addColorStop(0,base);pg.addColorStop(.65,mid);pg.addColorStop(1,'#ffffff');
      x.fillStyle=pg;x.beginPath();x.moveTo(0,0);
      x.bezierCurveTo(wid,-len*.22,wid*.92,-len*.84,0,-len);x.bezierCurveTo(-wid*.92,-len*.84,-wid,-len*.22,0,0);x.closePath();x.fill();
      x.strokeStyle='rgba(18,18,18,.6)';x.lineWidth=Math.max(1,R*.014);x.stroke();x.restore();};
    for(let i=0;i<8;i++)petal(i*TAU/8,R,R*.36,'#4a4a4a','#cfcfcf');
    for(let i=0;i<8;i++)petal((i+.5)*TAU/8,R*.64,R*.27,'#666666','#e4e4e4');
    const rg=x.createRadialGradient(cx,cy,0,cx,cy,R*.19);rg.addColorStop(0,'#161616');rg.addColorStop(.7,'#262626');rg.addColorStop(1,'#bdbdbd');
    x.fillStyle=rg;x.beginPath();x.arc(cx,cy,R*.19,0,TAU);x.fill();
  }
  else if(id==='facets'){
    const cols=9,rows=Math.max(3,Math.round(9*h/w));
    const px=w/cols,py=h/rows;
    const P=(i,j)=>[i*px+((i>0&&i<cols)?(rnd(i,j,3)-.5)*px*.6:0),j*py+((j>0&&j<rows)?(rnd(i,j,5)-.5)*py*.6:0)];
    const tri=(a,b,c,t)=>{const q=Math.round(255*clamp(t,0,1));
      x.fillStyle='rgb('+q+','+q+','+q+')';x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(c[0],c[1]);x.closePath();x.fill();};
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const a=P(i,j),b=P(i+1,j),c=P(i+1,j+1),d=P(i,j+1);
      const bias=1-(i/cols)*.50-(j/rows)*.30;
      tri(a,b,c,bias*(.30+.85*rnd(i,j,13)));
      tri(a,c,d,bias*(.30+.85*rnd(i,j,29)));}
  }

  else if(id==='ramp'){const g=x.createLinearGradient(0,h,w,0);g.addColorStop(0,'#000');g.addColorStop(1,'#fff');x.fillStyle=g;x.fillRect(0,0,w,h);}

  else if(id==='rings'){x.fillStyle='#0d0d0d';x.fillRect(0,0,w,h);const R=Math.hypot(w,h)/2;x.strokeStyle='#fff';
    for(let r=R;r>0;r-=R/14){x.lineWidth=R/26;x.globalAlpha=.3+.7*(1-r/R);x.beginPath();x.arc(w*.5,h*.55,r,0,TAU);x.stroke();}x.globalAlpha=1;}

  else if(id==='grid'){const n=8;for(let j=0;j<n;j++)for(let i=0;i<n;i++){const q=Math.round(255*(i+j*n)/(n*n-1));
      x.fillStyle='rgb('+q+','+q+','+q+')';x.fillRect(i*w/n,j*h/n,w/n+1,h/n+1);}}

  else if(id==='bars'){/* how fine a detail this tile size can still hold */
    x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle='#000';
    const bands=6;
    for(let b=0;b<bands;b++){const y0=b*h/bands,hh=h/bands;
      const per=w/Math.pow(2,b+1.6);
      for(let X=0;X<w;X+=per*2)x.fillRect(X,y0,per,hh-Math.max(1,h*.004));}
    x.fillStyle='#808080';x.fillRect(0,h-h/bands*.34,w,h/bands*.34);}

  else{const g=x.createRadialGradient(w*.5,h*.44,0,w*.5,h*.44,Math.max(w,h)*.6);

/* ================= perforated image panel =================
   Same picture, a different way of carrying it. Instead of turning a tile to steal more or
   less light, the sheet is punched on a fixed grid and the HOLE DIAMETER follows the tone —
   a halftone cut straight into metal. Big holes read light when the panel is backlit or sits
   against the sky, and read dark against a bright interior, which is why the backing matters
   as much as the image. Zahner call theirs ImageWall; Imark call theirs Ocular; the principle
   is the same and this is an independent model of it for coursework.
   The tone field is shared with the tile panel, so one picture drives either. */
function perfGenerate(st){
  const F=st.perf,W=st.width,H=st.height;
  const res={holes:[],open:0,W,H,warn:false,warnMsg:'',outline:null,area:W*H,
             perf:{made:0,skipped:0,minD:0,maxD:0,cols:0,rows:0,web:0}};
  ombDrawField();
  const x0=Math.max(0,st.frameL),y0=Math.max(0,st.frameB),x1=W-Math.max(0,st.frameR),y1=H-Math.max(0,st.frameT);
  if(x1-x0<10||y1-y0<10){res.warn=true;res.warnMsg='The frame leaves no face to perforate.';return res;}
  const pitch=Math.max(1.5,F.pitch),rp=Math.max(1.5,pitch*F.rowPitch);
  /* the web is the ligament of metal left between two holes: the number a fabricator checks first */
  const web=Math.max(.3,F.minWeb);
  const maxD=Math.max(.6,Math.min(F.maxD,pitch-web,rp-web));
  const minD=Math.max(0,Math.min(F.minD,maxD));
  const cols=Math.floor((x1-x0-maxD)/pitch)+1,rows=Math.floor((y1-y0-maxD)/rp)+1;
  if(cols<2||rows<2){res.warn=true;res.warnMsg='The pitch is too coarse for this panel.';return res;}
  if(cols*rows>46000){res.warn=true;res.warnMsg=(cols*rows).toLocaleString()+' holes is past what this view will draw \u2014 open the pitch, or make the panel smaller.';return res;}
  const sx=x0+(x1-x0-(cols-1)*pitch)/2,sy=y0+(y1-y0-(rows-1)*rp)/2;
  const step=F.levels>1?1/(F.levels-1):0;
  let dmin=1e9,dmax=0;
  const shape=(d,cx,cy)=>{
    const r=d/2;
    if(F.shape==='square')return[V(cx-r,cy-r),V(cx+r,cy-r),V(cx+r,cy+r),V(cx-r,cy+r)];
    if(F.shape==='diamond')return[V(cx,cy-r*1.3),V(cx+r*1.3,cy),V(cx,cy+r*1.3),V(cx-r*1.3,cy)];
    if(F.shape==='hex')return mv(regPoly(6,r/Math.cos(Math.PI/6),Math.PI/6),cx,cy);
    if(F.shape==='slot'){
      /* the slot grows with the tone like every other hole, but its LENGTH is capped by the
         row spacing: longer than that and it runs into the slot above it */
      const L=Math.max(r*1.05,Math.min(d*F.aspect,rp-web)/2),top=[],bot=[];
      for(let k=0;k<=10;k++){const a=Math.PI*k/10;top.push(V(cx+r*Math.cos(a),cy+(L-r)+r*Math.sin(a)));}
      for(let k=0;k<=10;k++){const a=Math.PI+Math.PI*k/10;bot.push(V(cx+r*Math.cos(a),cy-(L-r)+r*Math.sin(a)));}
      return top.concat(bot);}
    return mv(regPoly(20,r,0),cx,cy);};
  for(let j=0;j<rows;j++){
    const off=(j%2)?F.stagger*pitch:0;
    for(let i=0;i<cols;i++){
      const cx=sx+i*pitch+off,cy=sy+j*rp;
      if(cx<x0+maxD/2-1e-6||cx>x1-maxD/2+1e-6)continue;
      const u=clamp((cx-x0)/(x1-x0),0,1),v=clamp(1-(cy-y0)/(y1-y0),0,1);
      let t=ombSample(u,v);
      if(F.detail>0)t=clamp(t+(t-ombBlurAt(u,v))*F.detail*2.4,0,1);
      t=(t-.5)*F.contrast+.5+F.bright;
      t=Math.pow(clamp(t,0,1),F.gamma);
      if(step)t=Math.round(clamp(t,0,1)/step)*step;
      if(F.invert)t=1-t;
      t=clamp(t,0,1);
      const d=minD+(maxD-minD)*t;
      if(d<F.cutoff){res.perf.skipped++;continue;}   /* below the smallest punchable hole: no hole */
      const pts=shape(d,cx,cy);
      res.holes.push({kind:0,pts,d});res.open+=Math.abs(area(pts));
      if(d<dmin)dmin=d;if(d>dmax)dmax=d;res.perf.made++;}}
  res.perf.minD=res.perf.made?+dmin.toFixed(2):0;res.perf.maxD=+dmax.toFixed(2);
  res.perf.cols=cols;res.perf.rows=rows;res.perf.web=+(pitch-maxD).toFixed(2);
  res.perf.pitch=pitch;res.perf.rowPitch=rp;
  if(!res.perf.made){res.warn=true;res.warnMsg='Every hole came out below the cutoff \u2014 raise the largest hole, or lower the cutoff.';}
  return res;}

function dirOf(az,el){const a=az*D,e=el*D;return{x:Math.sin(a)*Math.cos(e),y:Math.sin(e),z:Math.cos(a)*Math.cos(e)};}
/* the light in panel coordinates: the panel face is +z, and an overhead panel is tipped back 90° */
function ombLight(st,az,el){const L=dirOf(az,el);return st.orient==='overhead'?{x:L.x,y:-L.z,z:L.y}:L;}
function tileNormal(th,a){const s=Math.sin(a);return{x:s*Math.sin(th),y:-s*Math.cos(th),z:Math.cos(a)};}

/* ---- the tone field: whatever the source is, it ends as one luminance raster ---- */
function ombField(cv){const w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data;
  const l=new Float32Array(w*h);for(let i=0;i<w*h;i++)l[i]=(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2])/255;
  OMB.cw=w;OMB.ch=h;OMB.lum=l;OMB.cv=cv;OMB.blur=boxBlur(l,w,h,Math.max(2,Math.round(Math.min(w,h)/22)));}
/* a separable box blur, so Detail can subtract the local average: a picture's small features
   (a gondola cabin, a cable, a letter) are exactly what the tile grid throws away first */
function boxBlur(src,w,h,r){const a=new Float32Array(w*h),b=new Float32Array(w*h),n=2*r+1;
  for(let y=0;y<h;y++){let sum=0;const o=y*w;
    for(let x=-r;x<=r;x++)sum+=src[o+clamp(x,0,w-1)];
    for(let x=0;x<w;x++){a[o+x]=sum/n;sum+=src[o+clamp(x+r+1,0,w-1)]-src[o+clamp(x-r,0,w-1)];}}
  for(let x=0;x<w;x++){let sum=0;
    for(let y=-r;y<=r;y++)sum+=a[clamp(y,0,h-1)*w+x];
    for(let y=0;y<h;y++){b[y*w+x]=sum/n;sum+=a[clamp(y+r+1,0,h-1)*w+x]-a[clamp(y-r,0,h-1)*w+x];}}
  return b;}
function ombBlurAt(u,v){const l=OMB.blur;if(!l)return ombSample(u,v);
  const x=Math.round(clamp(u*(OMB.cw-1),0,OMB.cw-1)),y=Math.round(clamp(v*(OMB.ch-1),0,OMB.ch-1));
  return l[y*OMB.cw+x];}
function ombSample(u,v){const l=OMB.lum;if(!l)return .5;
  const x=clamp(u*(OMB.cw-1),0,OMB.cw-1),y=clamp(v*(OMB.ch-1),0,OMB.ch-1);
  const x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(x0+1,OMB.cw-1),y1=Math.min(y0+1,OMB.ch-1),fx=x-x0,fy=y-y0;
  return (l[y0*OMB.cw+x0]*(1-fx)+l[y0*OMB.cw+x1]*fx)*(1-fy)+(l[y1*OMB.cw+x0]*(1-fx)+l[y1*OMB.cw+x1]*fx)*fy;}
function ombCanvas(W,H){const sc=Math.min(1,560/Math.max(W,H));const cv=document.createElement('canvas');
  cv.width=Math.max(8,Math.round(W*sc));cv.height=Math.max(8,Math.round(H*sc));return cv;}
function ombDrawSource(src,W,H){const cv=ombCanvas(W,H),x=cv.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,cv.width,cv.height);
  const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height;if(!sw||!sh){ombField(cv);return;}
  const F=S.omb.fit;let dw,dh;
  if(F==='stretch'){dw=cv.width;dh=cv.height;}
  else{const k=F==='cover'?Math.max(cv.width/sw,cv.height/sh):Math.min(cv.width/sw,cv.height/sh);dw=sw*k;dh=sh*k;}
  x.drawImage(src,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);ombField(cv);}
/* everything the raster of the source depends on: panel size and fit */
function fitKeyNow(){return S.width+'x'+S.height+'|'+S.omb.fit;}
function ombDrawField(){if(!OMB.srcEl)ombBuiltin((S.omb.src||'builtin:radial').split(':')[1]||'radial');
  const k=fitKeyNow();if(OMB.fitKey===k)return;OMB.fitKey=k;ombDrawSource(OMB.srcEl,S.width,S.height);}
function ombUse(el,label,kind){OMB.srcEl=el;OMB.label=label;OMB.kind=kind||'image';OMB.fitKey='';
  S.omb.label=label;if(kind)S.omb.src=kind;ombDrawField();ombPreview();schedule('geom');}



/* ---- lettering straight into the tone field ---- */
function ombLetter(txt,weight){const W=S.width,H=S.height,cv=ombCanvas(W,H),x=cv.getContext('2d'),w=cv.width,h=cv.height;
  x.fillStyle='#000';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
  const lines=txt.split(/\n/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return null;
  const fam='"Instrument Sans",system-ui,sans-serif';let size=100;
  x.font=weight+' '+size+'px '+fam;
  const widest=Math.max(...lines.map(l=>x.measureText(l).width));
  size=Math.min(size*(w*.86)/Math.max(1,widest),h*.86/(lines.length*1.18));
  x.font=weight+' '+size.toFixed(1)+'px '+fam;
  const lh=size*1.18,y0=h/2-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>x.fillText(l,w/2,y0+i*lh));
  OMB.srcEl=cv;OMB.kind='text';OMB.fitKey=fitKeyNow();ombField(cv);return cv;}

/* ---- an SVG the model wrote, cleaned and rasterised ---- */
function ombCleanSVG(t){const m=t.match(/<svg[\s\S]*<\/svg>/i);let s=m?m[0]:t;
  s=s.replace(/<\s*(script|foreignObject|iframe|image|animate\w*|set)\b[\s\S]*?<\/\s*\1\s*>/gi,'')
     .replace(/<\s*(script|foreignObject|iframe|image|animate\w*|set)\b[^>]*\/?>/gi,'')
     .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'')
     .replace(/\s(?:xlink:)?href\s*=\s*"(?!#)[^"]*"/gi,'').replace(/\s(?:xlink:)?href\s*=\s*'(?!#)[^']*'/gi,'')
     .replace(/@import[^;]*;/gi,'');
  if(!/xmlns=/.test(s))s=s.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');

function ombFromSVG(svg){return new Promise((res,rej)=>{const clean=ombCleanSVG(svg);

/* ---- tiles ---- */
function ombGenerate(st){
  const O=st.omb,W=st.width,H=st.height;
  const res={holes:[],open:0,W,H,warn:false,warnMsg:'',outline:null,area:W*H,tiles:[],omb:true,cols:0,rows:0};
  ombDrawField();
  const x0=Math.max(0,st.frameL),y0=Math.max(0,st.frameB),x1=W-Math.max(0,st.frameR),y1=H-Math.max(0,st.frameT);
  const Dm=Math.max(2,O.tileD),px=Math.max(Dm*.3,O.pitch),py=Math.max(Dm*.3,O.pitch*O.rowPitch);
  const availX=(x1-x0)-Dm,availY=(y1-y0)-Dm;
  if(availX<0||availY<0){res.warn=true;res.warnMsg='The frame leaves no room for a tile this size.';return res;}
  const cols=Math.floor(availX/px)+1,rows=Math.floor(availY/py)+1;
  if(cols*rows>24000){res.warn=true;res.warnMsg=(cols*rows).toLocaleString()+' tiles is more than this view will build. Raise the pitch or make the panel smaller.';return res;}
  res.cols=cols;res.rows=rows;
  const stag=rows>1?O.stagger*px:0;
  const gx=x0+Dm/2+(availX-((cols-1)*px+stag))/2,gy=y0+Dm/2+(availY-(rows-1)*py)/2;
  const a=O.tilt*D,L=ombLight(st,O.live?st.light.az:O.designAz,O.live?st.light.el:O.designEl);
  const Rp=Math.hypot(L.x,L.y),phi=Math.atan2(L.y,L.x),A=Math.sin(a)*Rp;
  if(O.encode==='rot'&&A<.06){res.warn=true;res.warnMsg='The design light is almost square-on to the panel, so turning a tile barely changes its tone. Move the design sun off the face: give it some azimuth, or put it higher.';}
  const tiles=[];const step=O.levels>1?1/(O.levels-1):0;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const cx=gx+i*px+((j&1)?stag:0),cy=gy+j*py;
    if(cx>x1-Dm/2+.01)continue;
    const u=(cx-x0)/Math.max(1,x1-x0),v=1-(cy-y0)/Math.max(1,y1-y0);
    let t=ombSample(u,v);
    if(O.detail>0)t=clamp(t+(t-ombBlurAt(u,v))*O.detail*2.4,0,1);
    t=(t-.5)*O.contrast+.5+O.bright;
    t=Math.pow(clamp(t,0,1),O.gamma);
    if(O.invert)t=1-t;
    if(O.dither)t+=BAYER[(j&3)*4+(i&3)]*(step||.055);
    t=clamp(t,0,1);
    if(step)t=Math.round(t/step)*step;
    let th,tilt;
    if(O.encode==='tilt'){th=phi+Math.PI/2;tilt=a*(.08+.92*t);}
    else{th=phi+Math.asin(clamp(2*t-1,-1,1));tilt=a;}
    tiles.push({x:cx,y:cy,th,tilt,t});
  }
  res.tiles=tiles;
  return res;
}

/* ---- shading: what a tile returns to a viewer standing in front of the panel ---- */
function ombShade(n,L,V,Lg,spec){
  const nd=Math.max(0,n.x*L.x+n.y*L.y+n.z*L.z);
  let hx=L.x+V.x,hy=L.y+V.y,hz=L.z+V.z;const hl=Math.hypot(hx,hy,hz)||1;hx/=hl;hy/=hl;hz/=hl;
  const sp=Math.pow(Math.max(0,n.x*hx+n.y*hy+n.z*hz),44)*(spec||0);
  return{d:Lg.ambient*.45+nd*Lg.intensity*.6,s:sp*Lg.intensity};}
function ombColour(sh,base,warm){
  const wr=1+.18*(warm-.5),wb=1-.22*(warm-.5);
  const r=clamp((base>>16&255)/255*sh.d*wr+sh.s,0,1),g=clamp((base>>8&255)/255*sh.d+sh.s,0,1),b=clamp((base&255)/255*sh.d*wb+sh.s,0,1);
  return'#'+[r,g,b].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('');}

/* ---- 2D: the reflected-light simulation, seen square on ---- */
function renderOmbrae2D(){
  const c=$('#view2d'),O=S.omb,W=G.W,H=G.H;
  const cols=S.arr==='grid'?S.cols:S.arr==='triptych'?3:1,rows=S.arr==='grid'?S.rows:1,gap=S.arr==='grid'?S.gap:30;
  const TW=W*cols+gap*(cols-1),TH=H*rows+gap*(rows-1),m=Math.max(TW,TH)*.03;
  const L=ombLight(S,S.light.az,S.light.el),Vv={x:0,y:0,z:1},base=MATERIALS[S.material].color;
  const plate=ombColour(ombShade({x:0,y:0,z:1},L,Vv,S.light,0),base,S.light.warmth);

function ombGeometry(Gm){
  const O=S.omb,t=S.thickness,r=O.tileD/2,seg=Math.max(8,Math.min(48,O.seg|0));
  const plate=extrudePoly([V(0,0),V(Gm.W,0),V(Gm.W,Gm.H),V(0,Gm.H)],null,0,t);
  if(!Gm.tiles.length)return plate;
  const tmpl=extrudePoly(regPoly(seg,r,0),null,-O.thick/2,O.thick);
  const tn=tmpl.index?tmpl.toNonIndexed():tmpl;
  const src=tn.attributes.position.array,len=src.length;
  const out=new Float32Array(len*Gm.tiles.length);let o=0;
  for(const tl of Gm.tiles){
    const c=Math.cos(tl.tilt),s=Math.sin(tl.tilt),ux=Math.cos(tl.th),uy=Math.sin(tl.th),k=1-c;
    const m00=c+k*ux*ux,m01=k*ux*uy,m02=s*uy;
    const m10=k*ux*uy,m11=c+k*uy*uy,m12=-s*ux;
    const m20=-s*uy,m21=s*ux,m22=c;
    const zc=t+O.rise+r*s+O.thick*.5;
    for(let i=0;i<len;i+=3){const x=src[i],y=src[i+1],z=src[i+2];
      out[o++]=m00*x+m01*y+m02*z+tl.x;out[o++]=m10*x+m11*y+m12*z+tl.y;out[o++]=m20*x+m21*y+m22*z+zc;}
  }
  if(tn!==tmpl)tn.dispose();tmpl.dispose();
  const discs=new THREE.BufferGeometry();discs.setAttribute('position',new THREE.BufferAttribute(out,3));
  return mergeGeoms([plate,discs]);
}

  const one=G.holes.map((h,i)=>{const f=rel?hs[i]/hmax:1;const l=rel?(carve?Math.round(35+40*(1-f)):Math.round(55+45*f)):null;const fill=rel?`hsl(38 30% ${l}%)`:voidFill;return`<polygon points="${h.pts.map(q=>q.x.toFixed(2)+','+(H-q.y).toFixed(2)).join(' ')}" fill="${fill}" stroke="#000" stroke-opacity=".55" stroke-width="${Math.max(.4,m/40)}"/>`;}).join('');
  const faceFill=pf&&pf.back==='backlit'?'#141A20':col2;
  let panels='';for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)panels+=`<g transform="translate(${i*(W+gap)} ${(rows-1-j)*(H+gap)})"><rect x="0" y="0" width="${W}" height="${H}" fill="${faceFill}" stroke="#000" stroke-opacity=".6" stroke-width="${m/10}"/>${one}</g>`;
  c.innerHTML=`<svg viewBox="${-m} ${-m} ${TW+2*m} ${TH+2*m}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${panels}
    <text x="${TW/2}" y="${TH+m*.8}" text-anchor="middle" font-size="${m*.6}" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${W} mm${cols>1?' × '+cols:''}</text>

}

function renderOrtho(){const c=$('#view2d');if(!G)return;const{W,H}=G;const cols=S.arr==='grid'?S.cols:S.arr==='triptych'?3:1,rows=S.arr==='grid'?S.rows:1,gap=S.arr==='grid'?S.gap:30;const TW=W*cols+gap*(cols-1),TH=H*rows+gap*(rows-1),m=Math.max(TW,TH)*.06,lw=Math.max(.5,Math.max(TW,TH)/900);

  const tileV=Math.PI*Math.pow(O.tileD/2,2)*O.thick,mass=(W*H*S.thickness+n*tileV)*1e-9*m.density;
  const copies=S.arr==='triptych'?3:S.arr==='grid'?S.cols*S.rows:1;
  const kg=mass<1?(mass*1000).toFixed(0)+' g':mass.toFixed(1)+' kg';
  const cover=n*Math.PI*Math.pow(O.tileD/2,2)/(W*H)*100;
  $('#stats').innerHTML='<span><b>'+n.toLocaleString()+'</b> tiles</span><span>'+G.cols+' × '+G.rows+' grid</span><span>Face covered <b>'+cover.toFixed(0)+'%</b></span><span><b>'+W+' × '+H+'</b> mm</span><span>≈ <b>'+kg+'</b> each</span>';
  fabStats.innerHTML='<b>'+n.toLocaleString()+'</b> optical tiles, Ø'+(+O.tileD).toFixed(1)+' mm at '+(+O.pitch).toFixed(2)+' mm pitch, tilted '+O.tilt+'° · '+G.cols+' × '+G.rows+' grid · ≈ <b>'+kg+'</b> per panel'+(copies>1?' (×'+copies+')':'')+' in '+m.name.toLowerCase()+'.';
  const L=ombLight(S,S.light.az,S.light.el),Lo=ombLight(S,O.live?S.light.az:O.designAz,O.live?S.light.el:O.designEl);
  const dot=L.x*Lo.x+L.y*Lo.y+L.z*Lo.z,off=Math.acos(clamp(dot,-1,1))*180/Math.PI;
  const read=clamp(1-off/62,0,1);
  $('#readout').innerHTML=(S.light.type==='sun'?'Sun':'Lamp')+' at <b>'+S.light.az+'°</b> / <b>'+S.light.el+'°</b> elevation<br>'
    +(O.live?'Tuned live — the image holds at every sun angle.':(off<4?'Standing in the design light: the image reads at full strength.':off.toFixed(0)+'° off the design light — the image reads at about <b>'+Math.round(read*100)+'%</b>'+(read<.12?', all but gone.':'.')))
    +'<br><span style="font-size:11.5px">Tone comes from how each tile is turned, so it is the light that makes the picture.</span>';
  const w=$('#warn');if(G.warn){w.textContent=G.warnMsg||'';w.classList.remove('hidden');}else w.classList.add('hidden');
  ombDesc();ombDial();
}

/* ================= run ================= */
function run(kinds){
  if(kinds.has('light')&&S.omb.on&&S.omb.live)kinds.add('geom');
  if(kinds.has('geom')){G=generate(S);rebuildScene();render2D();frameCamera();}
  if(kinds.has('mat')){updateMaterial();render2D();}
  if(kinds.has('light')){updateLights();if(S.omb.on&&!kinds.has('geom'))render2D();}
  updateStats();needsRender=true;historyPush();
}
/* ---- undo / redo. One entry per settled change: a slider drag collapses into one step,
   because entries within 700 ms replace the last rather than adding to it. ---- */
const HIST={stack:[],i:-1,skip:0,last:'',t:0};
function histKey(o){const c=JSON.parse(JSON.stringify(o));if(c.omb)delete c.omb.field;return JSON.stringify(c);}
function historyPush(){
  if(HIST.skip>0){HIST.skip--;return;}
  const snap=snapshot(),k=histKey(snap);if(k===HIST.last)return;
  const now=Date.now();
  if(HIST.i>=0&&now-HIST.t<700&&HIST.i===HIST.stack.length-1){HIST.stack[HIST.i]=snap;}
  else{HIST.stack.splice(HIST.i+1);HIST.stack.push(snap);if(HIST.stack.length>60)HIST.stack.shift();HIST.i=HIST.stack.length-1;}
  HIST.last=k;HIST.t=now;histButtons();}
function histButtons(){const u=$('#undoBtn'),r=$('#redoBtn');if(u)u.disabled=HIST.i<=0;if(r)r.disabled=HIST.i>=HIST.stack.length-1;}
function historyGo(d){const j=HIST.i+d;if(j<0||j>=HIST.stack.length)return;
  HIST.i=j;const p=HIST.stack[j];HIST.last=histKey(p);HIST.skip=1;HIST.t=0;
  restoreDesign(p);histButtons();toast(d<0?'Undone':'Redone');}
/* applyPreset, plus the two things it does not carry: which panel kind was on, and the picture */

  if(fld&&!(sn.omb&&sn.omb.on)){const im=new Image();im.onload=()=>{OMB.srcEl=im;OMB.label=sn.omb.label||'saved design';OMB.kind='image';OMB.fitKey='';ombDrawField();ombPreview();schedule('geom');};im.src=fld;}
  refreshAll();if(typeof perfDesc==='function')perfDesc();schedule('geom');schedule('mat');}

function applyPreset(p){

  if(p.element&&p.element!==S.element)applyElement(p.element);
  for(const k of keep)if(k in p)S[k]=p[k];
  if(p.pp)for(const id in p.pp)if(S.pp[id])Object.assign(S.pp[id],p.pp[id]);
  S.perf.on=false;
  if(p.perf)Object.assign(S.perf,p.perf);
  if(p.omb){const fld=p.omb.field;Object.assign(S.omb,Object.assign({detail:0},p.omb));delete S.omb.field;OMB.fitKey='';
    if(fld){const im=new Image();im.onload=()=>{OMB.srcEl=im;OMB.label=S.omb.label||'loaded design';OMB.fitKey='';ombDrawField();ombPreview();ombDesc();schedule('geom');};im.src=fld;}
    else if(/^builtin:/.test(S.omb.src||'')){ombBuiltin(S.omb.src.split(':')[1]);OMB.label=S.omb.label;ombPreview();}}

function randomize(){
  const ids=Object.keys(PATTERNS).filter(k=>PATTERNS[k].cat!=='source');const id=ids[Math.floor(Math.random()*ids.length)];const spec=PATTERNS[id];
  const pp={};for(const q of spec.params){if(q.type==='select')pp[q.k]=q.opts[Math.floor(Math.random()*q.opts.length)][0];else{const v=q.min+Math.random()*(q.max-q.min);pp[q.k]=Math.round(v/q.step)*q.step;}}

/* ---- saving a picture of either view. The 2D stage is an SVG, so it is redrawn into a
   canvas at twice size with the theme's own colours resolved first. ---- */
async function viewPNG(which){
  if(which==='3d'){if(!has3D)return null;renderer.render(scene,cam);
    return await new Promise(r=>renderer.domElement.toBlob(r,'image/png'));}
  const host=$('#view2d'),svg=host.querySelector('svg');if(!svg)return null;
  const box=host.getBoundingClientRect(),W=Math.max(320,Math.round(box.width)),H=Math.max(240,Math.round(box.height));
  const clone=svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',W);clone.setAttribute('height',H);
  const cs=getComputedStyle(document.documentElement);
  let txt=new XMLSerializer().serializeToString(clone)
    .replace(/var\(--([a-z0-9-]+)\)/g,(m,k)=>(cs.getPropertyValue('--'+k)||'').trim()||'#888888');
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(txt);});
  const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;
  const x=cv.getContext('2d');
  x.fillStyle=ortho?'#FFFFFF':((cs.getPropertyValue('--stage')||'').trim()||'#E9EDF2');
  x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(r,'image/png'));}
async function saveView(which){

/* minimal ZIP (stored) */
const CRC=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function makeZip(files){const enc=new TextEncoder();const parts=[],central=[];let off=0;const d=new Date();const dosT=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);const dosD=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dosT,true);lh.setUint16(12,dosD,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dosT,true);ch.setUint16(14,dosD,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    parts.push(lh.buffer,name,data);central.push(ch.buffer,name);off+=30+name.length+data.length;}
  const cdSize=central.reduce((a,b)=>a+b.byteLength,0);const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(4,0,true);end.setUint16(6,0,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);end.setUint16(20,0,true);
  return new Blob([...parts,...central,end.buffer],{type:'application/zip'});}

  /* a synchronous frame, for a recorder that cannot wait on requestAnimationFrame */
